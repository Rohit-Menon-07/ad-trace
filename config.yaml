# AD Trace runtime configuration. Model IDs are pinned (H11).
# Verify model IDs against Anthropic's current model list before each build.

models:
  generation: claude-sonnet-5-5      # S6 generation
  query_parser: claude-haiku-5-5     # S1 query understanding
  verifier: claude-haiku-5-5         # S7 independent verifier (H6)
  # temperature is NOT sent: Claude Haiku 5.5 and Sonnet 5.5 reject non-default sampling parameters (400),
  # and API version 2026-10-21 rejects them on every model. Determinism comes from the response cache (H11).
  max_tokens_generation: 1200        # Prompt 8 spec; thinking is between_tools so the budget is for output
  max_tokens_parser: 2048
  max_tokens_verifier: 1024

llm:
  timeout_s: 20
  max_retries: 2                     # SDK retries 408/409/429/5xx and connection errors with backoff
  validation_retries: 1              # one extra call when tool input fails Pydantic validation
  # Per-model request options. Forced tool_choice returns 400 on Claude Sonnet 5.5, so that model gets
  # tool_choice auto + strict tool schema + an explicit instruction, and a missing tool call is retried.
  model_options:
    claude-haiku-5-5: {forced_tool_choice: true, thinking: disabled, effort: low}
    claude-sonnet-5-5: {forced_tool_choice: false, thinking: between_tools, effort: medium}
  pricing_usd_per_mtok:              # first-party API list prices (input, output); cost is an estimate
    claude-haiku-5-5: [0.10, 0.50]
    claude-sonnet-5-5: [2.00, 10.00]
  call_log: logs/llm_calls.jsonl

# Verification layers (S7). Each can be switched off for the ablation study.
verify:
  quotes: true                       # H4 quote must be a substring of the cited sentence
  grounding: true                    # H5 entities, mandate language, fact consistency
  llm: true                          # H6 independent verifier (Haiku), one batched call
  min_rationale_steps: 2             # UI shows the model rationale only if this many steps survive

embeddings:
  model: BAAI/bge-small-en-v1.5
  fallback: tfidf_char_ngrams        # used if the model cannot be downloaded; reported in /api/meta
  query_instruction: "Represent this sentence for searching relevant passages: "
  header_max_models: 10              # models listed in the "Make Model | Subject Heading: " header
  batch_size: 64

retrieval:
  # bm25() column weights, in FTS column order. Higher = more important.
  fts_sentence_weights: {sentence_text: 1.0, subject_heading: 0.4, make: 0.3, models: 1.2, models_norm: 2.0}
  fts_record_weights: {subject_heading: 1.0, make: 0.3, models: 1.2, summary: 0.8, models_norm: 2.0}
  bm25_depth: 200                    # sentences taken from each ranking into the fusion
  dense_depth: 200
  extra_sentence_bonus: 0.02         # record score = best fused + bonus * (sum of next 2 fused scores); RRF steps are ~0.0003 per rank, so keep this small (tuned in Prompt 11)
  evidence_top_sentences: 3
  rerank:
    enabled: false                   # optional cross-encoder rerank of the top records
    model: cross-encoder/ms-marco-MiniLM-L-6-v2

data:
  raw_xlsx: "data/raw/AD Notice of Proposed Rulemaking (AD NPRM).xlsx"
  sqlite_path: data/processed/adtrace.db
  embeddings_path: data/index/emb_sentences.npy
  embedding_ids_path: data/index/ids.json
  coverage_report: data/processed/coverage_report.json
  eval_results: data/eval/results.json
  alias_make: configs/alias_make.yaml
  rules: configs/rules.yaml

# null = resolve to today's date at request time. The resolved date is echoed in
# every SearchResponse.as_of and written to the audit log.
as_of: null

thresholds:
  entity_fuzzy_min: 90               # rapidfuzz score (0-100) to accept a vocab match (H8)
  rrf_k: 60                          # Reciprocal Rank Fusion constant (S3)
  top_k_records: 8                   # records returned by retrieval (S3)
  evidence_sentences_max: 24         # sentences in the evidence pack (S6)
  min_retrieval_score: 0.015         # below this fused score -> LOW_RETRIEVAL_SCORE (S5); tune on eval set
  max_rationale_steps: 5             # H9
  latency_budget_ms: 3000            # retrieval target (sub-3-second)

logging:
  audit_log: logs/audit.jsonl
  feedback_log: logs/feedback.jsonl
  response_cache_dir: data/index/cache
